<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selecionar UPA | Meu UPA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --upa-primary:      #0d6efd;
            --upa-primary-deep: #0b4fb3;
            --upa-surface:      #f4f8ff;
            --upa-ink:          #10233f;
        }

        body {
            min-height: 100dvh;
            background:
                radial-gradient(circle at top left, rgba(13,110,253,0.08), transparent 28%),
                linear-gradient(180deg, #f8fbff 0%, #ffffff 38%, #f4f8ff 100%);
            color: var(--upa-ink);
        }

        .app-wrapper {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 2rem 1.25rem 6rem; /* padding-bottom deixa espaço pro botão fixo */
        }

        /* ── Cabeçalho ── */
        .tela-titulo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--upa-ink);
            margin-bottom: 0.25rem;
        }

        .tela-subtitulo {
            font-size: 0.9rem;
            color: #5c6b80;
            margin-bottom: 1.25rem;
        }

        /* ── Campo de busca ── */
        .busca-wrap {
            position: relative;
            margin-bottom: 1rem;
        }

        .busca-wrap .busca-icone {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #5c6b80;
            font-size: 1rem;
            pointer-events: none;
        }

        .busca-input {
            width: 100%;
            border: 1.5px solid #e2e8f0;
            border-radius: 999px;
            padding: 0.7rem 1rem 0.7rem 2.75rem;
            font-size: 0.95rem;
            background: #fff;
            color: var(--upa-ink);
            outline: none;
            transition: border-color 0.2s;
        }

        .busca-input:focus {
            border-color: var(--upa-primary);
            box-shadow: 0 0 0 3px rgba(13,110,253,0.12);
        }

        /* ── Lista de UPAs ── */
        .upa-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            background: #fff;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            padding: 0.85rem 1rem;
            margin-bottom: 0.6rem;
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .upa-item:hover {
            border-color: #93c5fd;
            background: #f0f7ff;
        }

        .upa-item.selected {
            border: 2px solid var(--upa-primary);
            background: #dbeafe;
            box-shadow: 0 4px 14px rgba(13,110,253,0.12);
        }

        .upa-item-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--upa-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .upa-item.selected .upa-item-icon {
            background: rgba(13,110,253,0.15);
        }

        .upa-item-nome {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--upa-ink);
            line-height: 1.3;
        }

        .upa-item-regiao {
            font-size: 0.8rem;
            color: #5c6b80;
        }

        .check-icon {
            margin-left: auto;
            color: var(--upa-primary);
            font-size: 1.2rem;
            display: none;
        }

        .upa-item.selected .check-icon {
            display: block;
        }

        /* ── Botão fixo no rodapé ── */
        .btn-fixo-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 1.25rem 1.5rem;
            background: linear-gradient(to top, #fff 70%, transparent);
            display: flex;
            justify-content: center;
        }

        .btn-fixo-inner {
            width: 100%;
            max-width: 430px;
        }

        .btn-prosseguir {
            width: 100%;
            height: 52px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-prosseguir:not(:disabled):active {
            transform: scale(0.97);
        }

        /* ── Nenhum resultado ── */
        .sem-resultado {
            display: none;
            text-align: center;
            color: #5c6b80;
            padding: 2rem 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <p class="tela-titulo">Selecionar UPA</p>
        <p class="tela-subtitulo">Escolha a unidade onde você está sendo atendido.</p>

        <!-- Campo de busca -->
        <div class="busca-wrap">
            <span class="busca-icone">🔍</span>
            <input
                type="text"
                class="busca-input"
                id="campoBusca"
                placeholder="Buscar UPA..."
                autocomplete="off"
                oninput="filtrarUpas(this.value)">
        </div>

        <!-- Formulário POST -->
        <form method="post" th:action="@{/app/selecionar-upa}" id="formUpa">
            <input type="hidden" name="upaId"   id="upaIdInput">
            <input type="hidden" name="upaNome" id="upaNomeInput">

            <!-- Lista de UPAs gerada pelo Thymeleaf -->
            <div id="listaUpas">
                <div
                    th:each="upa : ${upas}"
                    class="upa-item"
                    th:data-id="${upa.id}"
                    th:data-nome="${upa.nome}"
                    onclick="selecionarUpa(this)">

                    <div class="upa-item-icon">📍</div>

                    <div>
                        <div class="upa-item-nome"  th:text="${upa.nome}">UPA 24h Ceilândia</div>
                        
                    </div>

                    <span class="check-icon">✓</span>
                </div>
            </div>

            <p class="sem-resultado" id="semResultado">Nenhuma UPA encontrada.</p>
        </form>

    </div>

    <!-- Botão fixo no rodapé -->
    <div class="btn-fixo-wrap">
        <div class="btn-fixo-inner">
            <button
                type="submit"
                form="formUpa"
                id="btn-prosseguir"
                class="btn btn-primary btn-prosseguir"
                disabled>
                Prosseguir →
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function selecionarUpa(el) {
            // Remove seleção anterior
            document.querySelectorAll('.upa-item').forEach(i => i.classList.remove('selected'));

            // Marca o clicado
            el.classList.add('selected');

            // Preenche os inputs hidden
            document.getElementById('upaIdInput').value   = el.dataset.id;
            document.getElementById('upaNomeInput').value = el.dataset.nome;

            // Habilita o botão
            document.getElementById('btn-prosseguir').disabled = false;
        }

        function filtrarUpas(termo) {
            const itens = document.querySelectorAll('#listaUpas .upa-item');
            const t = termo.toLowerCase().trim();
            let visiveis = 0;

            itens.forEach(item => {
                const nome = item.dataset.nome.toLowerCase();
                if (nome.includes(t)) {
                    item.style.display = 'flex';
                    visiveis++;
                } else {
                    item.style.display = 'none';
                }
            });

            document.getElementById('semResultado').style.display = visiveis === 0 ? 'block' : 'none';
        }
    </script>
</body>
</html>
