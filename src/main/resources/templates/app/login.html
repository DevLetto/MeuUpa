<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Meu UPA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --upa-primary: #0d6efd;
            --upa-primary-deep: #0b4fb3;
            --upa-surface: #f4f8ff;
            --upa-ink: #10233f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            background: radial-gradient(circle at top left, rgba(13,110,253,0.08), transparent 28%),
                        linear-gradient(180deg, #f8fbff 0%, #ffffff 38%, #f4f8ff 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* ── Cabeçalho acima do card ── */
        .page-header {
            text-align: center;
        }

        .page-header .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #5c6b80;
            text-decoration: none;
            margin-bottom: 1.25rem;
            transition: color 0.15s;
        }

        .page-header .back-link:hover { color: var(--upa-primary); }

        .logo-mini {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--upa-primary-deep), var(--upa-primary));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            margin: 0 auto 1rem;
            box-shadow: 0 6px 16px rgba(13,110,253,0.3);
        }

        /* ── Card principal ── */
        .login-card {
            background: #fff;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 18px 40px rgba(15,23,42,0.10),
                        0 2px 8px rgba(13,110,253,0.06);
            border: 1px solid rgba(13,110,253,0.08);
        }

        .login-card h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--upa-ink);
            margin-bottom: 0.25rem;
        }

        .login-card .card-desc {
            font-size: 0.85rem;
            color: #5c6b80;
            margin-bottom: 1.5rem;
        }

        /* ── Campos do formulário ── */
        .field-group {
            margin-bottom: 1.125rem;
        }

        .field-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--upa-ink);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .field-group .input-wrap {
            position: relative;
        }

        .field-group .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1rem;
            pointer-events: none;
        }

        .field-group input {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            padding: 0 14px 0 40px;
            font-size: 1rem;
            color: var(--upa-ink);
            background: #f8fbff;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .field-group input:focus {
            border-color: var(--upa-primary);
            box-shadow: 0 0 0 3px rgba(13,110,253,0.12);
            background: #fff;
        }

        /* ── Botão entrar ── */
        .btn-entrar {
            width: 100%;
            height: 52px;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--upa-primary-deep) 0%, var(--upa-primary) 55%, #45a3ff 100%);
            border: none;
            color: #fff;
            box-shadow: 0 6px 20px rgba(13,110,253,0.32);
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 0.5rem;
            cursor: pointer;
        }

        .btn-entrar:hover, .btn-entrar:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(13,110,253,0.4);
            color: #fff;
        }

        .btn-entrar:active { transform: translateY(0); }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 1.25rem 0;
            color: #cbd5e1;
            font-size: 0.78rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        /* ── Rodapé do card ── */
        .card-footer-link {
            text-align: center;
            font-size: 0.85rem;
            color: #5c6b80;
        }

        .card-footer-link a {
            color: var(--upa-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .card-footer-link a:hover { text-decoration: underline; }

        /* ── Alerta de erro ── */
        .alert-erro {
            border-radius: 12px;
            font-size: 0.875rem;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 12px 14px;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- Cabeçalho -->
        <div class="page-header">
            <a th:href="@{/app}" href="/app" class="back-link">
                <i class="bi bi-arrow-left"></i> Voltar ao início
            </a>
            <div class="logo-mini"><i class="bi bi-hospital"></i></div>
        </div>

        <!-- Card de login -->
        <div class="login-card">
            <h2>Identificação do Paciente</h2>
            <p class="card-desc">Use os dados do seu cadastro na UPA para entrar.</p>

            <!--
                ALERTA DE ERRO — exibido quando o parâmetro URL "erro=true" está presente.
                Thymeleaf verifica th:if="${param.erro}" para renderizar ou não este bloco.
            -->
            <div th:if="${param.erro}"
                 class="alert alert-danger alert-erro"
                 role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0 mt-1"></i>
                <span>CPF ou data de nascimento incorretos. Verifique os dados e tente novamente.</span>
            </div>

            <!--
                Formulário POST para /app/login.
                O controller recebe "cpf" e "dataNascimento" como @RequestParam.
            -->
            <form th:action="@{/app/login}" action="/app/login" method="post">

                <!-- Campo CPF -->
                <div class="field-group">
                    <label for="cpf">CPF</label>
                    <div class="input-wrap">
                        <i class="bi bi-person-vcard input-icon"></i>
                        <input type="text"
                               id="cpf"
                               name="cpf"
                               placeholder="000.000.000-00"
                               inputmode="numeric"
                               maxlength="14"
                               autocomplete="off"
                               required>
                    </div>
                </div>

                <!-- Campo Data de Nascimento -->
                <div class="field-group">
                    <label for="dataNascimento">Data de Nascimento</label>
                    <div class="input-wrap">
                        <i class="bi bi-calendar3 input-icon"></i>
                        <input type="date"
                               id="dataNascimento"
                               name="dataNascimento"
                               required>
                    </div>
                </div>

                <!-- Botão Entrar -->
                <button type="submit" class="btn btn-entrar">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Entrar
                </button>

            </form>

            <div class="divider">ou</div>

            <!-- Link para aviso de cadastro -->
            <div class="card-footer-link">
                Não está cadastrado?
                <a th:href="@{/app/aviso-cadastro}" href="/app/aviso-cadastro">
                    Saiba como se cadastrar
                </a>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script>
        /**
         * Máscara de CPF — formata o campo enquanto o usuário digita.
         * Formato: 000.000.000-00
         */
        document.getElementById('cpf').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, ''); // remove tudo que não é dígito

            if (value.length > 11) value = value.slice(0, 11);

            // Aplica máscara progressivamente
            if (value.length <= 3) {
                e.target.value = value;
            } else if (value.length <= 6) {
                e.target.value = value.slice(0, 3) + '.' + value.slice(3);
            } else if (value.length <= 9) {
                e.target.value = value.slice(0, 3) + '.' + value.slice(3, 6) + '.' + value.slice(6);
            } else {
                e.target.value = value.slice(0, 3) + '.' + value.slice(3, 6) + '.' + value.slice(6, 9) + '-' + value.slice(9);
            }
        });
    </script>
</body>
</html>
